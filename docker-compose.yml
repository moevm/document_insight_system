services:
  worker-base:
    image: dvivanov/dis:worker-base-${IMAGE_VERSION:?Run make sync-version to derive IMAGE_VERSION from package.json}
    profiles:
      - build-base
    build:
      context: .
      dockerfile: Dockerfile_worker_base
      args:
        - IMAGE_VERSION=${IMAGE_VERSION:?Run make sync-version to derive IMAGE_VERSION from package.json}
        - VCS_REF=${VCS_REF:-unknown}
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - SOURCE_BRANCH=${SOURCE_BRANCH:-unknown}
        - SOURCE_STATE=${SOURCE_STATE:-unknown}

  volumes-init:
    image: dis:web-image-${IMAGE_VERSION:?Run make sync-version to derive IMAGE_VERSION from package.json}
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    command: ["/bin/sh", "./scripts/init_volumes.sh", "/usr/src/project/files", "/etc/db"]
    volumes:
      - files:/usr/src/project/files
      - flower_data:/etc/db

  web:
    build:
      context: .
      args:
        - IMAGE_VERSION=${IMAGE_VERSION:?Run make sync-version to derive IMAGE_VERSION from package.json}
        - VCS_REF=${VCS_REF:-unknown}
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - SOURCE_BRANCH=${SOURCE_BRANCH:-unknown}
        - SOURCE_STATE=${SOURCE_STATE:-unknown}
    image: dis:web-image-${IMAGE_VERSION:?Run make sync-version to derive IMAGE_VERSION from package.json}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always
    init: true
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      volumes-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=UTF-8
      - CELERY_BROKER_URL=${REDIS_URL}
      - CELERY_RESULT_BACKEND=${REDIS_URL}
    volumes:
      - files:/usr/src/project/files/
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    cpuset: ${CONTAINER_CPU:-0-1}

  worker:
    build:
      context: .
      dockerfile: Dockerfile_worker
      args:
        - IMAGE_VERSION=${IMAGE_VERSION:?Run make sync-version to derive IMAGE_VERSION from package.json}
        - VCS_REF=${VCS_REF:-unknown}
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - SOURCE_BRANCH=${SOURCE_BRANCH:-unknown}
        - SOURCE_STATE=${SOURCE_STATE:-unknown}
    image: dis:worker-image-${IMAGE_VERSION:?Run make sync-version to derive IMAGE_VERSION from package.json}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: always
    command: celery --app=app.tasks.celery worker -n celery@worker --beat --schedule=/home/app/celerybeat-schedule -Q ${CELERY_QUERIES} --loglevel=info
    environment:
      - CELERY_BROKER_URL=${REDIS_URL}
      - CELERY_RESULT_BACKEND=${REDIS_URL}
    depends_on:
      volumes-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - files:/usr/src/project/files/
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    cpuset: ${CONTAINER_CPU:-0-1}
    mem_limit: ${WORKER_MEMORY:-1G}

  worker-dashboard:
    image: dis:worker-image-${IMAGE_VERSION:?Run make sync-version to derive IMAGE_VERSION from package.json}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["/bin/sh", "./scripts/start_flower.sh"]
    ports:
      - "${FLOWER_PORT}:5555"
    environment:
      - SECRET_KEY=${FLOWER_SECRET_KEY}
      - FLOWER_PREFIX=${FLOWER_PREFIX:-}
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH}
      - CELERY_BROKER=${REDIS_URL}
      - CELERY_BACKEND=${REDIS_URL}
    volumes:
      - flower_data:/etc/db/
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    depends_on:
      volumes-init:
        condition: service_completed_successfully
      worker:
        condition: service_started
      redis:
        condition: service_healthy
    cpuset: ${CONTAINER_CPU:-0-1}

  redis:
    image: redis:6-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis_data:/data
    cpuset: ${CONTAINER_CPU:-0-1}

  mongodb:
    image: mongo:8-noble
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    command:
      - '--wiredTigerCacheSizeGB=${MONGODB_CACHE_SIZE:-1}'
    volumes:
      - ../dis_mongo_data:/data/db
    cpuset: ${CONTAINER_CPU:-0-1}

volumes:
  flower_data:
  files:
  redis_data:
