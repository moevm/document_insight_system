{% extends 'root.html' %}
{% block title %}Пользователи{% endblock %}
{% block main %}
<div class="holder row"><div class="container-fluid">
    <h3 id="user_title" class="mt-3">Пользователи</h3>
    <table id="user-list-table" class="table"><thead><tr>
        <th data-field="username" data-sortable="true">Логин</th>
        <th data-field="name" data-sortable="true">Имя</th>
        <th data-field="role" data-sortable="true">Роль</th>
        <th data-field="is_LTI" data-sortable="true">Вход</th>
        <th data-field="all_formats" data-sortable="true">Форматы</th>
        <th data-field="all_criteria" data-sortable="true">Набор критериев</th>
        <th data-field="check_counts" data-sortable="true">Загрузок</th>
    </tr></thead></table>
</div></div>
<script src="{{ url_for('static', filename='user_list.js') }}"></script>
{% endblock %}
