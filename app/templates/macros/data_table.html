{% macro checks_table(id, user=none) %}
<table id="{{ id }}" class="table" data-admin="{{ 'true' if current_user.is_admin else 'false' }}"{% if user %} data-user="{{ user }}"{% endif %}>
    <thead><tr>
        <th data-field="_id">ID проверки</th>
        <th data-field="filename" data-sortable="true">Файл</th>
        <th data-field="criteria" data-sortable="true">Набор критериев</th>
        {% if current_user.is_admin %}
        <th data-field="user" data-sortable="true">Пользователь</th>
        <th data-field="lms-user-id">ID в LMS</th>
        {% endif %}
        <th data-field="upload-date" data-sortable="true">Загружено</th>
        <th data-field="moodle-date" data-sortable="true">Оценка в LMS</th>
        <th data-field="status">Состояние</th>
        <th data-field="score" data-sortable="true">Оценка</th>
    </tr></thead>
</table>
{% endmacro %}
