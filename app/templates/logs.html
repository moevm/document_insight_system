{% extends 'root.html' %}
{% block title %}Журнал{% endblock %}
{% block main %}
<div class="holder row"><div class="container-fluid">
    <h3 class="mt-3">Журнал</h3>
    <table id="logs-table" class="table"><thead><tr>
        <th data-field="timestamp" data-sortable="true">Время</th>
        <th data-field="check_id">ID проверки</th>
        <th data-field="stage">Этап</th>
        <th data-field="service-name" data-sortable="true">Сервис</th>
        <th data-field="levelname" data-sortable="true">Уровень</th>
        <th data-field="message">Сообщение</th>
        <th data-field="pathname">Путь</th>
        <th data-field="lineno" data-sortable="true">Строка</th>
    </tr></thead></table>
</div></div>
<script src="{{ url_for('static', filename='logs.js') }}"></script>
{% endblock %}
